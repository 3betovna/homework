<!DOCTYPE html>
<html class="page" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/base/index.css">
    <script defer src="./js/index.js" type="module"></script>
    <title>California</title>
</head>
<body class="page__body">
    <header class="header">
    <div class="container header__container">
            <a class="header__logo" href="#">
                <img class="header__logo-img" src="./icons/logo.svg" alt="California logo">
            </a>
            <nav class="menu header__menu" id="header__menu" aria-label="Main menu" style>
                <ul class="menu__list">
                    <li class="menu__list-item">
                        <a class="menu__list-link" href="#">all products</a>
                    </li>
                    <li class="menu__list-item">
                        <a class="menu__list-link menu__dropdown" href="#">Solutions</a>
                    </li>
                    <li class="menu__list-item">
                        <a class="menu__list-link" href="#">ABOUT</a>
                    </li>
                    <li class="menu__list-item">
                        <a class="menu__list-link" href="#">Support</a>
                    </li>
                </ul>
            </nav>
            <div class="header__actions">
                <button class="header__actions-btn" title="Search" aria-label="Search">
                    <svg width="24" height="24">
                        <use class="header__actions-icon" href="./icons/sprite.svg#search"></use>
                    </svg>
                </button>
                <button class="header__actions-btn" title="Cart" aria-label="Cart">
                    <svg width="24" height="24">
                        <use class="header__actions-icon" href="./icons/sprite.svg#cart"></use>
                    </svg>
                </button>
                <button class="header__burger burger">
                    <svg width="24" height="24">
                        <use class="burger__icon-menu" href="./icons/sprite.svg#menu-burger"></use>
                        <use class="burger__icon-cross" href="./icons/sprite.svg#menu-cross"></use>
                    </svg>
                </button>
            </div>
    </div>
    </header>
</body>
</html>
