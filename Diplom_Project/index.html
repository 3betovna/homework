<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/base/index.css">
    <title>California</title>
</head>
<body>
    <div class="container header__container">
        <header class="header">
            <a class="header__logo" href="#">
                <img class="header__logo-img" src="./icons/logo.svg" alt="California logo">
            </a>
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__list-item">
                        <a class="header__list-link" href="#">all products</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__list-link header__dropdown" href="#">Solutions</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__list-link" href="#">ABOUT</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__list-link" href="#">Support</a>
                    </li>
                </ul>
            </nav>
            <div class="header__actions">
                <button class="header__actions-btn" title="Search" aria-label="Search">
                    <svg width="24" height="24">
                        <use class="header__actions-icon" href="./icons/sprite.svg#search"></use>
                    </svg>
                </button>
                <button class="header__actions-btn" title="Cart" aria-label="Cart">
                    <svg width="24" height="24">
                        <use class="header__actions-icon" href="./icons/sprite.svg#cart"></use>
                    </svg>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
